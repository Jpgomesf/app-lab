[project]
name = "api"
version = "0.1.0"
description = "HTTP API service"
requires-python = ">=3.12"
# Intentionally empty: the service is stdlib-only for now.
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
# Keeps the src layout importable without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
