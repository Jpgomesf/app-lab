# Alembic configuration for local CLI use (`uv run alembic ...` from apps/api).
#
# In the cluster nothing reads this file: `python -m api.migrate` builds the
# same configuration in code and takes the URL from DATABASE_URL.
[alembic]
script_location = src/api/migrations
prepend_sys_path = src
# Populated from DATABASE_URL by migrations/env.py; left blank so a stale
# value here can never point a migration at the wrong database.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
