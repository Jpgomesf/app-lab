name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; no job here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are wasted minutes; main runs are left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub's `paths:` filter is per-workflow, not per-matrix-leg, so the
  # per-app filtering is done here and fed to the matrix below.
  changes:
    name: detect changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select apps to check
        id: filter
        env:
          # Read through env rather than inline `${{ }}` in run: — that is the
          # documented way to keep expressions out of the shell.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] \
            || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # No usable base (first push, force push, re-run): check everything.
            changed="__ALL__"
          else
            changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          selected=()
          for app in api mcp-server; do
            if [ "${changed}" = "__ALL__" ] || printf '%s\n' "${changed}" | grep -qE \
              "^(apps/${app}/|\.github/workflows/ci\.yml$|requirements-dev\.txt$)"; then
              selected+=("${app}")
            fi
          done

          json="$(printf '%s\n' "${selected[@]:-}" \
            | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "apps=${json}" >> "$GITHUB_OUTPUT"
          echo "selected: ${json}"

  check:
    name: check (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        env:
          APP_DIR: apps/${{ matrix.app }}
        run: ruff check "$APP_DIR"

      - name: Format check
        env:
          APP_DIR: apps/${{ matrix.app }}
        run: ruff format --check "$APP_DIR"

      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: pytest
