name: zizmor

# Static analysis of the workflows themselves: unpinned actions, excessive
# permissions, template injection, leaked checkout credentials.
on:
  pull_request:
    paths:
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: audit workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # SARIF upload needs GitHub Advanced Security, which a fresh private
          # repo does not have. Findings fail the job instead. Flip to `auto`
          # once the repo is public or GHAS is enabled, and add
          # `security-events: write` to the permissions block above.
          advanced-security: false
